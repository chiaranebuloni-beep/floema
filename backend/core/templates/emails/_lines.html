<p style="margin:36px 0 12px;font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:#a29686;">Riepilogo</p>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-top:1px solid #e2d8cb;">
  {% for line in lines %}
  <tr>
    {% if line.image_url %}
    <td width="88" valign="top" style="padding:16px 16px 16px 0;border-bottom:1px solid #e2d8cb;">
      <img src="{{ line.image_url }}" width="88" height="88" alt="{{ line.name }}" style="display:block;width:88px;height:88px;object-fit:cover;border:0;background:#eee7de;">
    </td>
    {% endif %}
    <td valign="middle" style="padding:16px 0;border-bottom:1px solid #e2d8cb;">
      <div style="font-size:15px;font-weight:300;letter-spacing:.08em;text-transform:uppercase;color:#2a2c2a;">{{ line.name }}</div>
      <div style="font-size:13px;color:#6f665b;margin-top:4px;">{% if line.variant %}{{ line.variant }} · {% endif %}Quantità {{ line.qty }}</div>
    </td>
    <td valign="middle" align="right" style="padding:16px 0;border-bottom:1px solid #e2d8cb;font-size:15px;white-space:nowrap;color:#2a2c2a;">{{ line.total|floatformat:2 }} €</td>
  </tr>
  {% endfor %}
  <tr>
    <td colspan="3" style="padding:18px 0 0;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td style="font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#2a2c2a;">Totale</td>
          <td align="right" style="font-size:22px;font-weight:300;letter-spacing:.02em;color:#2a2c2a;white-space:nowrap;">{{ order.total|floatformat:2 }} €</td>
        </tr>
        <tr><td colspan="2" align="right" style="font-size:12px;color:#a29686;padding-top:2px;">IVA inclusa</td></tr>
      </table>
    </td>
  </tr>
</table>
