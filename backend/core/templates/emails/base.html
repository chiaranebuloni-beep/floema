<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <title>{{ subject }}</title>
  <style>
    /* Telefono: margini più stretti e titolo più piccolo (le caselle che non leggono questo stile usano i valori in linea). */
    @media (max-width: 480px) {
      .fl-pad { padding-left: 22px !important; padding-right: 22px !important; }
      .fl-body h1 { font-size: 30px !important; }
      .fl-step { padding: 12px 9px !important; }
      .fl-step-label { font-size: 9px !important; letter-spacing: .06em !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background:#ffffff;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#1e1e1e;-webkit-font-smoothing:antialiased;">
  {# Anteprima nella casella di posta, nascosta nel corpo. #}
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">{{ preheader }}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#ffffff;">
    <tr><td align="center" style="padding:24px 12px 40px;">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;">

        <tr><td class="fl-pad" style="padding:24px 40px 28px;border-bottom:1px solid #1e1e1e;">
          <a href="{{ site_url }}" style="text-decoration:none;">
            <img src="{{ logo_url }}" width="150" height="36" alt="FLOEMA" style="display:block;width:150px;height:36px;border:0;">
          </a>
        </td></tr>

        <tr><td class="fl-pad fl-body" style="padding:48px 40px 48px;font-size:15px;line-height:1.65;color:#1e1e1e;">
          {{ body|safe }}
        </td></tr>

        <tr><td class="fl-pad" style="padding:28px 40px 0;border-top:1px solid #e5e5e5;font-size:12px;line-height:1.7;color:#737373;">
          Hai domande sul tuo ordine? Rispondi a questa email o scrivi a
          <a href="mailto:{{ store_email }}" style="color:#1e1e1e;">{{ store_email }}</a>.
        </td></tr>
        <tr><td class="fl-pad" style="padding:16px 40px 0;font-size:11px;line-height:1.7;color:#a3a3a3;">
          <a href="{{ site_url }}" style="color:#1e1e1e;text-decoration:none;letter-spacing:.24em;text-transform:uppercase;font-size:10px;">FLOEMA Wood Studio</a><br>
          {{ company }}
        </td></tr>

      </table>
    </td></tr>
  </table>
</body>
</html>
